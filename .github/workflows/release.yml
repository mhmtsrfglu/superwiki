name: Release

# Run by hand: Actions -> Release -> Run workflow, and choose the size of the version bump.
# It tests, bumps the version, publishes to npm, pushes the commit and tag, and creates a GitHub release.
# Needs the repository secret NPM_TOKEN: an npm access token allowed to publish `superwiki`.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write   # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm test

      - name: Bump version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node scripts/sync-version.mjs)" >> "$GITHUB_OUTPUT"
          node scripts/build.mjs

      - name: Commit and tag
        run: |
          git config user.name "Mehmet Serefoglu"
          git config user.email "memet.serefoglu@gmai.com"
          git add -A
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      # Publish before pushing: if npm refuses, nothing has been pushed and the run can simply be repeated.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push commit and tag
        run: git push origin HEAD:main "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        run: gh release create "v${{ steps.version.outputs.version }}" --title "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
